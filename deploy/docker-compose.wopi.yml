version: '3.7'

services:
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: article-design-backend
    env_file:
      - ../server/.env
    ports:
      - "3001:3001"
    volumes:
      - ../server/uploads:/usr/src/app/uploads
    restart: always

  collabora:
    image: collabora/code:latest
    container_name: collabora-online
    environment:
      - domain=your-domain\\.com
      - server_name=collabora\\.your-domain\\.com
      - dictionaries=en_US
      - username=admin
      - password=yourpassword
      - extra_params=--o:ssl.enable=true --o:ssl.termination=false
    ports:
      - "9980:9980"
    volumes:
      - collabora_data:/data
    restart: always

  nginx:
    image: nginx:stable
    container_name: collabora-proxy
    depends_on:
      - collabora
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/letsencrypt
    restart: always

volumes:
  collabora_data:
    driver: local
  certs:
    driver: local
