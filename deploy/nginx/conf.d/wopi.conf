server {
  listen 80;
  server_name collabora.your-domain.com;

  # Redirect HTTP to HTTPS (in production set up certbot / TLS)
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name collabora.your-domain.com;

  ssl_certificate /etc/letsencrypt/live/collabora.your-domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/collabora.your-domain.com/privkey.pem;

  location / {
    proxy_pass http://collabora:9980;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Websockets and chunked responses
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Increase timeouts
    proxy_read_timeout 36000s;
    proxy_send_timeout 36000s;
  }
}

# Nginx proxy for WOPI host (backend)
server {
  listen 80;
  server_name wopi.your-domain.com;
  location / {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
